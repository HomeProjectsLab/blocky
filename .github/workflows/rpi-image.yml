name: rpi-image

# Bakes the unattended Raspberry Pi 3 appliance image and uploads it.
# Manual (workflow_dispatch) or on a published release. The bake needs
# privileged loop devices, so it runs the build script inside a privileged
# container step on the GitHub-hosted runner (which permits --privileged).

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile jungleblock (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o jungleblock-arm64 .

      - name: Bake image (privileged)
        run: |
          docker run --privileged --rm \
            -v "$PWD":/repo -v "$PWD/jungleblock-arm64":/jungleblock-arm64:ro -w /repo \
            -e BLOCKY_BIN=/jungleblock-arm64 -e OUT=/repo/jungleblock-rpi3-arm64.img.xz \
            ubuntu:24.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq util-linux dosfstools e2fsprogs xz-utils fdisk curl ca-certificates >/dev/null
              deploy/rpi/build-image.sh'

      - name: Checksums
        run: sha256sum jungleblock-rpi3-arm64.img.xz | tee jungleblock-rpi3-arm64.img.xz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jungleblock-rpi3-arm64-image
          path: |
            jungleblock-rpi3-arm64.img.xz
            jungleblock-rpi3-arm64.img.xz.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jungleblock-rpi3-arm64.img.xz
            jungleblock-rpi3-arm64.img.xz.sha256
