# blocky appliance — container stack for the Raspberry Pi image.
#
# Updates are pull-based: push a new image to ghcr and the box picks it up via
# `docker compose pull && up -d` — on every boot (bootstrap.sh) and every few
# minutes (blocky-update.timer, a host systemd unit). We do NOT use Watchtower:
# containrrr/watchtower is abandoned and its Docker API client (v1.25) is too
# old for a modern Docker Engine (min API 1.40), so it crash-looped forever and
# never updated anything. The host docker CLI always matches the daemon's API.
services:
  blocky:
    image: ghcr.io/homeprojectslab/blocky:latest
    container_name: blocky
    # Host networking is REQUIRED, not a shortcut: with bridge networking every
    # LAN client would arrive as the docker gateway address, which silently
    # destroys per-client blocking segmentation, client fingerprinting, device
    # -class personas and the client stats. It also avoids a userland proxy hop
    # on every DNS packet.
    network_mode: host
    restart: unless-stopped
    command: ["serve", "--db-dir", "/data"]
    volumes:
      - /var/lib/blocky:/data
      - /boot/firmware/appliance.yml:/appliance.yml:ro
    cap_add:
      - NET_BIND_SERVICE # bind :53 and :80 without running as root
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The HDMI console dashboard is NOT here: it runs as a host systemd unit
  # (blocky-dashboard.service) bound to tty1, because a container with tty:true
  # draws into a dockerd-held PTY that never renders on the physical console.
